version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current; each update is a reviewable PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # NuGet packages of the plugin and its tests. The Jellyfin packages are left out: they must name targetAbi
  # (check-manifest.sh), so moving them is a release decision with build.yaml, not a Dependabot PR.
  - package-ecosystem: nuget
    directories:
      - /Jellyfin.Plugin.Jellywave
      - /Jellyfin.Plugin.Jellywave.Tests
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "Jellyfin.*"
