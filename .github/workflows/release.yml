name: Release

# Tag v<version> (e.g. v0.1.0.0, matching Directory.Build.props) to verify, build and publish that tagged commit and
# commit its manifest entry to main. Can also be started by hand for an existing tag (Actions > Release > Run workflow,
# or `gh workflow run Release -f tag=v0.1.0.0`), e.g. to finish a run that stopped part way.
#
# The tag is resolved to one commit SHA, and that same SHA is verified (the shared checks in verify.yml) and built.
# The write token never meets the build: `build` stages the zip with a read-only token and no stored credentials;
# `publish` gets contents: write and runs only scripts/publish-release.sh (gh, jq, git, unzip, md5sum) against that zip,
# and refuses a tag that moved since it was resolved. Re-running is safe: the release is created as a draft, the zip attached, then published, and a zip already
# attached is reused, never replaced (see the script).
# Actions are pinned to full commit SHAs (tag in the comment); Dependabot proposes updates.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.0.0'
        required: true
        type: string

permissions: {}

# One release run at a time, and a waiting run queues instead of being cancelled (queue: max): two runs must not race
# on a release or the manifest, and no tag may be dropped.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

env:
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Resolve the tag to one commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  build:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Build and stage the verified commit
        run: VERSION="${VERSION#v}" scripts/build.sh

      - name: Check metadata agreement
        run: scripts/check-manifest.sh

      - name: Hand the zip to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Jellywave_*.zip
            dist/Jellywave_*/meta.json

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main (the manifest's source of truth)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch the built zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist

      - name: Publish the release and its manifest entry
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/publish-release.sh "$VERSION"
