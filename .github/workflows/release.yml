name: Release

# Tag v<version> (e.g. v0.1.0.0, matching Directory.Build.props) to build that
# tagged commit, attach the zip to a GitHub release, and commit the refreshed
# manifest.json to main. Safe to re-run: release and asset uploads are idempotent.
# Can also be started by hand for an existing tag (Actions > Release > Run workflow,
# or `gh workflow run Release -f tag=v0.1.0.0`), e.g. when a tag was pushed before main existed.
#
# Two jobs so the write token never meets the build: `build` restores packages, runs the analyzers
# and tests and stages the zip with a read-only token and no stored credentials; `publish` gets
# contents: write and runs only gh, jq and scripts/update-manifest.sh against that zip.
# Actions are pinned to full commit SHAs (tag in the comment); Dependabot proposes updates.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.0.0'
        required: true
        type: string

permissions: {}

env:
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests
        run: dotnet test Jellyfin.Plugin.Jellywave.Tests -c Release --nologo

      - name: Build and stage the tagged commit
        run: VERSION="${VERSION#v}" scripts/build.sh

      - name: Check metadata agreement
        run: scripts/check-manifest.sh

      - name: Hand the zip to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Jellywave_*.zip
            dist/Jellywave_*/meta.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main (the manifest's source of truth)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch the built zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${VERSION#v}"
          NOTES="$(jq -r .changelog "dist/Jellywave_${V}/meta.json")"
          gh release view "$VERSION" >/dev/null 2>&1 \
            || gh release create "$VERSION" --verify-tag --title "Jellywave $V" --notes "$NOTES"
          gh release upload "$VERSION" "dist/Jellywave_${V}.zip" --clobber

      - name: Commit manifest.json to main
        run: |
          V="${VERSION#v}"
          META="dist/Jellywave_${V}/meta.json"
          # Changelog, timestamp and targetAbi come from the zip's own meta.json, so the entry describes that zip.
          CHANGELOG="$(jq -r .changelog "$META")"
          TIMESTAMP="$(jq -r .timestamp "$META")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TARGET_ABI="$(jq -r .targetAbi "$META")" scripts/update-manifest.sh "$V" "$CHANGELOG" "$TIMESTAMP"
          # main's update-manifest.sh runs here; if it predates TARGET_ABI (a tag released before its branch
          # was merged) it would write main's targetAbi. Refuse an entry that does not describe this zip.
          jq -e --arg v "$V" --arg abi "$(jq -r .targetAbi "$META")" \
            'any(.[0].versions[]; .version == $v and .targetAbi == $abi)' manifest.json >/dev/null \
            || { echo "manifest entry for $V does not carry the zip's targetAbi; merge the release's branch into main first" >&2; exit 1; }
          git add manifest.json
          git diff --cached --quiet && { echo "manifest already current"; exit 0; }
          git commit -m "chore: manifest for ${VERSION}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "could not push manifest after 3 attempts" >&2; exit 1
